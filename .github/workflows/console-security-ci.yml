name: SOC security and build
on:
  push:
    paths:
      - 'console/**'
      - '.github/workflows/console-security-ci.yml'
  pull_request:
    paths:
      - 'console/**'
      - '.github/workflows/console-security-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      # Existing package-lock predates the Neon client dependency. Resolve it in CI
      # until a regenerated, committed lockfile restores strict npm ci.
      - name: Install dependencies (legacy lockfile reconciliation)
        run: npm install --no-audit --no-fund
        working-directory: console
      - name: Tenant isolation and RBAC tests
        run: node --experimental-strip-types --test tests/*.test.mjs
        working-directory: console
      - name: Production build
        run: npm run build
        working-directory: console
